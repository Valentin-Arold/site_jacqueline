<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Télécommande Bruno</title>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 50px 15px 15px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .top-status-header {
      position: fixed;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      background: rgba(18, 18, 18, 0.85);
      padding: 6px 12px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .settings-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      background: rgba(18, 18, 18, 0.85);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2em;
      cursor: pointer;
      z-index: 100;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s;
    }

    .settings-btn:active {
      transform: scale(0.9);
    }

    .settings-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 200;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    .settings-content {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .close-settings {
      background-color: #555;
      margin-top: 10px;
    }

    .led-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #e74c3c;
      box-shadow: 0 0 8px rgba(231, 76, 60, 0.8);
      flex-shrink: 0;
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    .led-red { background-color: #e74c3c; box-shadow: 0 0 8px rgba(231, 76, 60, 0.8); }
    .led-orange { background-color: #f39c12; box-shadow: 0 0 8px rgba(243, 156, 18, 0.8); }
    .led-green { background-color: #2ecc71; box-shadow: 0 0 8px rgba(46, 204, 113, 0.8); }

    .status-text {
      font-size: 0.85em;
      font-weight: bold;
      color: #e74c3c;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-card {
      background: rgba(255, 255, 255, 0.08);
      padding: 16px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .section-title {
      margin-top: 0;
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.15em;
      color: #3498db;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .peer-config-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .peer-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      padding: 10px;
      font-size: 0.9em;
      outline: none;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 200px;
      background-color: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    #remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #local-video {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 80px;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #fff;
    }

    .btn {
      background-color: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95em;
      transition: background 0.1s, transform 0.1s;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active {
      background-color: rgba(255, 255, 255, 0.35);
      transform: scale(0.96);
    }

    .btn-connect { background-color: #3498db; padding: 0 15px; }
    .btn-call { width: 100%; background-color: #27ae60; padding: 14px; font-size: 1.05em; }
    .btn-power { background-color: #e74c3c; width: 100%; }
    .btn-restart-app { background-color: #e74c3c; width: 100%; margin-top: 16px; }

    .grid-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .grid-row .btn { flex: 1; }

    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 240px;
      margin: 15px auto;
    }

    .btn-ok { background-color: #2980b9; font-weight: bold; }

    .grid-channels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .custom-channel-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .channel-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #fff;
      font-size: 1.1em;
      text-align: center;
      font-weight: bold;
      outline: none;
      padding: 8px;
    }

    .learn-select {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="top-status-header">
    <div id="status-led" class="led-indicator led-red"></div>
    <span id="peer-status" class="status-text">Déconnecté</span>
  </div>

  <button class="settings-btn" onclick="toggleSettings()">⚙️</button>

  <!-- Modale des parametres -->
  <div id="settings-modal" class="settings-modal">
    <div class="settings-content">
      <h3 style="margin-top: 0; text-align: center;">Paramètres</h3>

      <button onclick="sendBboxCmd('reset_cert')" class="btn" style="background-color: #d35400;">🔄 Reset Cert Bbox</button>

      <div style="display: flex; gap: 10px;">
        <input type="text" id="pairing-input" class="peer-input" placeholder="Code Pairing Bbox">
        <button onclick="sendPairing()" class="btn btn-connect">Pairing</button>
      </div>

      <hr style="border-color: rgba(255,255,255,0.1); margin: 10px 0;">

      <h4 style="margin: 0; text-align: center;">🎓 Apprentissage IR TV Salon</h4>
      <p style="font-size: 0.8em; color: #aaa; text-align: center; margin: 0;">Sélectionnez une touche à enregistrer.</p>

      <select id="learn-btn-select" class="learn-select">
        <option value="tv_power">Bouton Power TV</option>
        <option value="tv_1">Bouton 1</option>
        <option value="tv_2">Bouton 2</option>
        <option value="tv_3">Bouton 3</option>
        <option value="tv_4">Bouton 4</option>
        <option value="tv_5">Bouton 5</option>
        <option value="tv_6">Bouton 6</option>
        <option value="tv_7">Bouton 7</option>
        <option value="tv_8">Bouton 8</option>
        <option value="tv_9">Bouton 9</option>
        <option value="tv_0">Bouton 0</option>
        <option value="tv_up">Flèche Haut</option>
        <option value="tv_down">Flèche Bas</option>
        <option value="tv_left">Flèche Gauche</option>
        <option value="tv_right">Flèche Droite</option>
        <option value="tv_ok">Bouton OK</option>
        <option value="tv_input">Bouton Input / Source</option>
        <option value="tv_menu">Bouton Menu</option>
      </select>

      <button onclick="startBroadlinkLearn()" class="btn" style="background-color: #8e44ad;">📡 Apprendre la touche</button>

      <button onclick="toggleSettings()" class="btn close-settings">Fermer</button>
    </div>
  </div>

  <div class="container">

    <!-- CATÉGORIE 1 : VISIO -->
    <div class="section-card">
      <h3 class="section-title">📹 Visio</h3>

      <div class="peer-config-row">
        <input type="text" id="peer-id-input" class="peer-input" placeholder="ID Cible" value="reveil-ubuntu-bbox">
        <button onclick="saveAndConnect()" class="btn btn-connect">Connexion</button>
      </div>

      <div class="video-container">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>

      <button id="call-btn" onclick="startCall()" class="btn btn-call">📞 Lancer la Visio</button>
    </div>

    <!-- CATÉGORIE 2 : TÉLÉCOMMANDE BBOX -->
    <div class="section-card">
      <h3 class="section-title">📺 Télécommande Bbox</h3>

      <div class="grid-row">
        <button onclick="sendBboxCmd('power')" class="btn btn-power">🔴 On / Veille</button>
      </div>

      <div class="dpad-container">
        <div></div>
        <button onclick="sendBboxCmd('up')" class="btn">▲</button>
        <div></div>
        <button onclick="sendBboxCmd('left')" class="btn">◄</button>
        <button onclick="sendBboxCmd('ok')" class="btn btn-ok">OK</button>
        <button onclick="sendBboxCmd('right')" class="btn">►</button>
        <div></div>
        <button onclick="sendBboxCmd('down')" class="btn">▼</button>
        <div></div>
      </div>

      <div class="grid-row">
        <button onclick="sendBboxCmd('vol_down')" class="btn">🔈 Vol -</button>
        <button onclick="sendBboxCmd('mute')" class="btn">🔇 Mute</button>
        <button onclick="sendBboxCmd('vol_up')" class="btn">🔊 Vol +</button>
      </div>

      <div class="grid-channels">
        <button onclick="changeBboxChannel('1')" class="btn">TF1</button>
        <button onclick="changeBboxChannel('2')" class="btn">France 2</button>
        <button onclick="changeBboxChannel('3')" class="btn">France 3</button>
        <button onclick="changeBboxChannel('5')" class="btn">Arte</button>
        <button onclick="changeBboxChannel('6')" class="btn">M6</button>
        <button onclick="changeBboxChannel('12')" class="btn">NRJ12</button>
      </div>

      <div class="custom-channel-row">
        <input type="number" id="custom-channel" class="channel-input" value="1" min="1" max="999" inputmode="numeric">
        <button onclick="sendCustomChannel()" class="btn btn-connect">OK</button>
      </div>

      <button onclick="restartApp()" class="btn btn-restart-app">🔄 Redémarrer l'application</button>
    </div>

    <!-- CATÉGORIE 3 : TÉLÉCOMMANDE TV SALON -->
    <div class="section-card">
      <h3 class="section-title">📺 Télécommande TV Salon</h3>

      <div class="grid-row">
        <button onclick="sendBroadlinkCmd('tv_power')" class="btn btn-power">🔴 Power TV</button>
      </div>

      <!-- Pavé numérique 1-9 -->
      <div class="grid-channels">
        <button onclick="sendBroadlinkCmd('tv_1')" class="btn">1</button>
        <button onclick="sendBroadlinkCmd('tv_2')" class="btn">2</button>
        <button onclick="sendBroadlinkCmd('tv_3')" class="btn">3</button>
        <button onclick="sendBroadlinkCmd('tv_4')" class="btn">4</button>
        <button onclick="sendBroadlinkCmd('tv_5')" class="btn">5</button>
        <button onclick="sendBroadlinkCmd('tv_6')" class="btn">6</button>
        <button onclick="sendBroadlinkCmd('tv_7')" class="btn">7</button>
        <button onclick="sendBroadlinkCmd('tv_8')" class="btn">8</button>
        <button onclick="sendBroadlinkCmd('tv_9')" class="btn">9</button>
      </div>

      <div class="grid-row">
        <button onclick="sendBroadlinkCmd('tv_0')" class="btn" style="max-width: 33%;">0</button>
      </div>

      <!-- Options Input et Menu -->
      <div class="grid-row" style="margin-top: 10px;">
        <button onclick="sendBroadlinkCmd('tv_input')" class="btn" style="background-color: #d35400;">📥 Input</button>
        <button onclick="sendBroadlinkCmd('tv_menu')" class="btn" style="background-color: #7f8c8d;">📋 Menu</button>
      </div>

      <!-- Pavé directionnel -->
      <div class="dpad-container">
        <div></div>
        <button onclick="sendBroadlinkCmd('tv_up')" class="btn">▲</button>
        <div></div>
        <button onclick="sendBroadlinkCmd('tv_left')" class="btn">◄</button>
        <button onclick="sendBroadlinkCmd('tv_ok')" class="btn btn-ok">OK</button>
        <button onclick="sendBroadlinkCmd('tv_right')" class="btn">►</button>
        <div></div>
        <button onclick="sendBroadlinkCmd('tv_down')" class="btn">▼</button>
        <div></div>
      </div>
    </div>

  </div>

  <script>
    let peerTargetId = "reveil-ubuntu-bbox";
    let peer = null;
    let dataConn = null;
    let localStream = null;

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function toggleSettings() {
      const modal = document.getElementById('settings-modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function updateStatus(state, message) {
      const statusEl = document.getElementById('peer-status');
      const ledEl = document.getElementById('status-led');

      ledEl.className = 'led-indicator';
      statusEl.textContent = message;

      if (state === 'green') {
        ledEl.classList.add('led-green');
        statusEl.style.color = "#2ecc71";
      } else if (state === 'orange') {
        ledEl.classList.add('led-orange');
        statusEl.style.color = "#f39c12";
      } else {
        ledEl.classList.add('led-red');
        statusEl.style.color = "#e74c3c";
      }
    }

    function saveAndConnect() {
      const inputVal = document.getElementById('peer-id-input').value.trim();
      if (!inputVal) return;
      peerTargetId = inputVal;
      localStorage.setItem('bbox_peer_target_id', peerTargetId);
      if (dataConn) dataConn.close();
      if (peer) peer.destroy();
      initPeerJS();
    }

    function initPeerJS() {
      updateStatus('orange', 'Initialisation...');
      peer = new Peer();

      peer.on('open', () => {
        updateStatus('orange', 'Connexion...');
        connectDataChannel();
      });

      peer.on('error', () => {
        updateStatus('red', 'Erreur connexion');
      });
    }

    function connectDataChannel() {
      if (!peer || peer.destroyed) return;
      dataConn = peer.connect(peerTargetId, { reliable: true });

      dataConn.on('open', () => {
        updateStatus('green', 'Connecté');
      });

      dataConn.on('close', () => {
        updateStatus('red', 'Déconnecté');
      });
    }

    async function startCall() {
      triggerHaptic();
      const callBtn = document.getElementById('call-btn');

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
        document.getElementById('local-video').srcObject = localStream;

        const mediaCall = peer.call(peerTargetId, localStream);
        mediaCall.on('stream', (remoteStream) => {
          document.getElementById('remote-video').srcObject = remoteStream;
          callBtn.style.backgroundColor = "#c0392b";
          callBtn.textContent = "🛑 Raccrocher";
          callBtn.onclick = () => location.reload();
        });
      } catch (err) {
        alert("Impossible d'accéder à la caméra/micro.");
      }
    }

    function sendBboxCmd(cmd) {
      triggerHaptic();
      fetch(`http://${location.hostname}:3000/?cmd=${cmd}`).catch(() => {
        if (dataConn && dataConn.open) dataConn.send({ type: 'cmd', value: cmd });
      });
    }

    function sendBroadlinkCmd(btnName) {
      triggerHaptic();
      fetch(`http://${location.hostname}:3000/?broadlink_cmd=${btnName}`)
        .then(res => res.text())
        .then(res => {
          if (res !== "OK") alert(`Impossible d'envoyer le code IR pour "${btnName}"`);
        });
    }

    function startBroadlinkLearn() {
      const selectedBtn = document.getElementById('learn-btn-select').value;
      alert(`Pointe la télécommande vers le RM4 Pro et appuie sur la touche "${selectedBtn}".`);

      fetch(`http://${location.hostname}:3000/?broadlink_learn=${selectedBtn}`)
        .then(res => res.text())
        .then(res => {
          if (res === "OK") alert(` Signal IR enregistré pour "${selectedBtn}" !`);
          else alert("Erreur lors de l'apprentissage IR.");
        });
    }

    function sendPairing() {
      triggerHaptic();
      const textVal = document.getElementById('pairing-input').value.trim();
      fetch(`http://${location.hostname}:3000/?cmd=send_pairing&payload=${textVal}`);
    }

    function changeBboxChannel(channel) {
      triggerHaptic();
      fetch(`http://${location.hostname}:3000/?channel=${channel}`);
    }

    function sendCustomChannel() {
      const input = document.getElementById('custom-channel');
      if (input.value.trim() !== "") changeBboxChannel(input.value.trim());
    }

    function restartApp() {
      triggerHaptic();
      if (confirm("Redémarrer l'application ?")) sendBboxCmd('restart_app');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedId = localStorage.getItem('bbox_peer_target_id');
      if (savedId) {
        peerTargetId = savedId;
        document.getElementById('peer-id-input').value = savedId;
      }
      initPeerJS();
    });
  </script>
</body>

</html>
